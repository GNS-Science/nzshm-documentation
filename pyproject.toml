[project]
name = "nzshm-documentation"
version = "0.1.0"
description = "mkdocs documentation package for NSHM"
authors = [{ name = "NSHM Project", email = "nshm@gns.cri.nz" }]
license = "AGPL"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "mkdocs>=1.4.3,<2.0",
    "mkdocs-include-markdown-plugin>=3.0.0,<4.0",
    "mkdocs-material>=9.1.19,<10.0",
    "mkdocs-material-extensions>=1.1.1,<2.0",
    "mkdocstrings>=0.22.0,<0.23",
    "mkdocstrings-python>=1.2.1,<2.0",
    "mkdocs-pymdownx-material-extras>=2.4.3,<3.0",
    "mkdocs-with-pdf>=0.9.3,<0.10",
]

[project.optional-dependencies]

[tool.uv]
# docs-only project: no installable package
package = false
exclude-newer = "1 week"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
